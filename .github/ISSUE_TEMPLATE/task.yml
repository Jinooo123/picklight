name: 任务
description: 对应 docs/06-task-breakdown.md 里的任务编号（T-xxx）。新任务先补进任务表，再提 Issue。
title: "[T-xxx] "
labels: ["type/feat"]
body:
  - type: markdown
    attributes:
      value: |
        一个 Issue 只对应一项任务。分支名 `feat/T-101-简述`，PR 标题 `feat(T-101): 说明`。
  - type: input
    id: task_id
    attributes:
      label: 任务编号
      description: 在 docs/tasks.csv 中能查到的编号
      placeholder: T-101
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 负责人
      placeholder: 潘宇
    validations:
      required: true
  - type: dropdown
    id: week
    attributes:
      label: 计划周次
      options:
        - W1（11/21-11/27）
        - W2（11/28-12/04）
        - W3（12/05-12/11）
        - W4（12/12-12/18）
        - W5（12/19-12/26）
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 一行一条，合并前逐条勾选；无法验证的条目请改写
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: 依赖与风险
      description: 依赖哪些任务或接口，可能卡在哪
      placeholder: 依赖 T-502 上传接口；风险：视频大文件上传在弱网下超时
  - type: checkboxes
    id: ready
    attributes:
      label: 开工前确认
      options:
        - label: 依赖的任务都已在 main 上合并
          required: true
        - label: 需要改的接口或库表字段已与对应负责人确认

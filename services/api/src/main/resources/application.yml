server:
  port: 8080

spring:
  application:
    name: picklight-api
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  level:
    root: info
    com.picklight: debug

# 数据库、JWT 密钥等本地配置放在 application-local.yml（已在 .gitignore 中忽略）
# 参考 application-local.yml.example，启动时加 --spring.profiles.active=local
